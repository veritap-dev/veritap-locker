# §0 isolation: shares NOTHING with groundtruth-router or veritap-jobs.
name = "veritap-locker"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false
routes = [{ pattern = "locker.veritap.dev", custom_domain = true }]

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "veritap_locker"
database_id = "c4dfb885-34de-4666-8e8b-dfde61264077"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "BODIES"
bucket_name = "veritap-locker-bodies"

[triggers]
crons = ["*/15 * * * *", "10 5 * * *"]   # sweep · daily credit burn

[vars]
LOCKER_ENABLED = "true"
# #773-C1: "on" = normal; "off" = wind-down read-only (writes 503, reads/acks up).
LOCKER_WRITES = "on"
# #773-A1: spend breaker daily ceiling (USD). Worst possible day ~= this number.
DAILY_COST_BUDGET_USD = "50"
PUBLIC_BASE_URL = "https://locker.veritap.dev"
# Phase B: x402 live on Base Sepolia (hosted keyless facilitator). Mainnet
# flip = X402_NETWORK "base" + CDP-authed facilitator URL — config, not code.
# The address is checksummed and is the ONLY payment credential deployed;
# the wallet key lives in the operator's Base app, never here.
X402_ENABLED = "true"
# MAINNET: CDP facilitator (JWT from CDP secrets) is the default for "base" —
# no FACILITATOR_URL override needed. Bazaar flag stays OFF until the $5
# smoke purchase clears (spec §13 Phase B ordering).
X402_NETWORK = "base"
RECEIVING_ADDRESS = "0x5c7872C6aA7Da867F52733Cebf469f4b9A113f2B"
# Secrets: NONCE_HMAC_KEY, CDP_API_KEY_ID, CDP_API_KEY_SECRET (wrangler secret put).

# #773-B2: nightly D1 export target — separate bucket, 30-day rotation.
[[r2_buckets]]
binding = "BACKUP"
bucket_name = "veritap-locker-backup"
